<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome</title>
    <link rel="stylesheet" href="dist/output.css">
</head>

<body>

    <div class="flex justify-center items-center h-screen">
        <div class=" flex flex-col text-center bg-blue-400 text-white h-[80%] md:w-1/2 rounded-2xl">
            <h1 class="font-bold text-2xl md:text-5xl mt-16 ">
                Is Your Word A Palindrome
            </h1>
            <form class="flex justify-center items-center text-center flex-col mt-20 gap-5">
                <input type="text" placeholder="Enter Word"
                    class="text-center w-5/6 bg-white text-black outline-none rounded p-4">
                <button
                    class="p-4 bg-white text-black text-[18px] rounded-2xl w-1/2 transition-all duration-300 hover:bg-blue-950 hover:shadow-lg hover:shadow-black-500/50 cursor-pointer hover:text-white">
                    Check
                </button>
            </form>
        </div>
    </div>



</body>

</html>
